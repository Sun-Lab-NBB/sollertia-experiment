# Defines the build system used for the project.
[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

# Project metadata section. Provides the general ID information about the project.
[project]
name = "sollertia-experiment"
version = "5.0.0"
description = "Provides data acquisition and preprocessing runtimes for Sollertia platform data acquisition systems."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Ivan Kondratyev" },
    { name = "Kushaan Gupta" },
    { name = "Natalie Yeung" },
    { name = "Katlynn Ryu" },
    { name = "Jasmine Si" },
]
maintainers = [
    { name = "Ivan Kondratyev", email = "ik278@cornell.edu" },
]

keywords = ["sollertia", "ataraxis", "data-acquisition", "mesoscope", "experiment"]

classifiers = [
    # Development status
    "Development Status :: 5 - Production/Stable",
    # Intended audience and project topic
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    # Supported Python Versions
    "Programming Language :: Python :: 3.14",
    # Supported Operating Systems
    "Operating System :: POSIX :: Linux",
    # Typing
    "Typing :: Typed",
]

# Runtime project dependencies.
dependencies = [
    # Ataraxis Libraries
    "ataraxis-time==7.0.0",
    "ataraxis-base-utilities==7.0.0",
    "ataraxis-data-structures==7.1.0",
    "ataraxis-transport-layer-pc==5.1.0",
    "ataraxis-communication-interface==7.1.1",
    "ataraxis-video-system==5.1.1",

    # Sollertia Libraries
    "sollertia-shared-assets==10.0.0rc3",

    # Hardware Control
    "zaber-motion==10.0.0",

    # Scientific Computing
    "numpy==2.5.2",
    "numba==0.67.0",
    "scipy==1.18.0",
    "matplotlib==3.11.1",

    # Imaging
    "tifffile==2026.8.16",
    # Required by tifffile to (de)compress LERC-encoded TIFFs.
    "imagecodecs==2026.8.16",

    # GUI
    "pyside6==6.11.2",

    # Google Sheets API
    "google-api-python-client==2.198.0",
    "google-auth==2.56.3",

    # CLI and Utilities
    "click==8.4.2",
    "questionary==2.1.1",
    # Imported directly by the terminal prompt helpers to clear the type-ahead buffer.
    "prompt-toolkit==3.0.53",
    "crc==7.1.0",
    "tabulate==0.10.0",
    "tqdm==4.70.0",
    "natsort==8.4.0",
    "pyyaml==6.0.3",

    # MCP and HTTP
    "mcp==2.0.0",
    # Pinned directly, rather than left to the mcp requirement, because the Unity bridge client uses it to
    # communicate with the Unity Editor.
    "httpx2==2.12.0",
]

# Project repository and hosted documentation URLs.
[project.urls]
Homepage = "https://github.com/Sun-Lab-NBB/sollertia-experiment"
Documentation = "https://sollertia-experiment-api-docs.netlify.app/"

# Currently, the library is interfaced with through the consolidated 'sle' CLI exposed below.
[project.scripts]
sle = "sollertia_experiment.interfaces.entry_points:sle_cli"

# Development dependencies (PEP 735). Not published to PyPI.
[dependency-groups]
dev = [
    # Tox
    "tox>=4,<5",
    "uv>=0,<1",
    "tox-uv>=1,<2",

    # Development Automation
    "ataraxis-automation>=9,<10",

    # Types
    "google-api-python-client-stubs>=1,<2",
    "scipy-stubs>=1,<2",
    "types-pyyaml>=6,<7",
    "types-tabulate>=0,<1",
    "types-tqdm>=4,<5",
]

# Specifies files that should not be included in the source-code distribution.
[tool.hatch.build.targets.sdist]
exclude = [".github", "recipe"]

# Specifies the library structure.
[tool.hatch.build.targets.wheel]
packages = ["src/sollertia_experiment"]

# Ruff Configuration.
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"  # Targets the lowest supported version of python
src = ["src"]

# Excludes 'service' .py files, such as the sphinx configuration file, from linting.
extend-exclude = ["conf.py"]

# Checks for all potential violations and uses the exclusions below to target-disable specific ones.
lint.select = ["ALL"]

# General ignore directives
lint.ignore = [
    # Universal lint.ignore corpus. Present in every Ataraxis framework and Sollertia platform project.
    "W291",    # Conflicts with docstring formatting
    "ANN401",  # While suboptimal, ANY is a helpful type when used with caution
    "BLE001",  # Broad exception handling is necessary at library boundaries
    "C901",    # Sometimes complex functions are necessary
    "PLR0911", # Sometimes complex return graphs are necessary
    "PLR0912", # Sometimes complex functions are necessary
    "PLR0913", # Sometimes complex functions are necessary
    "PLR0915", # Sometimes functions with many statements are necessary
    "PLR0917", # PLR0913 already covers argument counts, and call sites pass keyword arguments
    "COM812",  # Conflicts with the formatter
    "ISC001",  # Conflicts with the formatter
    "PT001",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT023",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "D107",    # __init__ is documented inside the main class docstring where applicable
    "D205",    # Bugs out for file descriptions
    "PLW0603", # While global statement usage is not ideal, it streamlines certain development patterns
    "TID252",  # Conflicts with the library import management strategy, which requires parent-relative imports
    "CPY001",  # The license is declared in the LICENSE file and the license and license-files metadata fields

    # Project-specific
    "S603",    # Every subprocess call passes a fixed argument vector, with no shell and no user input
]

# Additional formatting configurations
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false  # Like black, honors magic trailing commas
line-ending = "auto"               # Automatically detects and standardizes line-ending character

# Docstrings and comments' line length
[tool.ruff.lint.pycodestyle]
max-doc-length = 120  # Maximum documentation line length, the same as code

# Docstrings style
[tool.ruff.lint.pydocstyle]
convention = "google"

# Additional, file-specific 'ignore' directives
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Imported but unused
    "F403", # Wildcard imports
]

# Import sorting and grouping configurations
[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true          # Combines multiple "as" imports for the same package
force-wrap-aliases = true          # Wraps "as" imports so that each uses a separate line
force-sort-within-sections = true  # Forces "as" and "from" imports for the same package to be close
length-sort = true                 # Places shorter imports first

# MyPy configuration section.
[tool.mypy]
# Strict mode settings (--strict), plus the unused-config warning that --strict does not enable
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

extra_checks = true

pretty = true

exclude = [
    "sollertia-experiment-\\d+",  # The temporary folder created when building the sdist
    "venv.*/",
    "build/",
    "dist/",
    "docs/",
    "stubs/",                     # stubgen output target
    "recipe/",                    # grayskull output target
    "tests/",
]
